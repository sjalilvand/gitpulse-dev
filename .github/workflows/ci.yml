name: GitPulse AI CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Lint with flake8 (اختیاری)
        run: |
          pip install flake8
          flake8 app/ --count --max-complexity=10 --max-line-length=120 --statistics || true

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_KEY: test-secret
          AVALAI_API_KEY: fake-key
          AVALAI_BASE_URL: https://api.avalai.ir/v1
        run: |
          # ساخت دیتابیس موقت و اجرای تست‌ها
          python -c "from app.db.postgres import engine, Base; from app.db.models.repository import Repository; from app.db.models.commit import Commit; from app.db.models.pull_request import PullRequest; from app.db.models.issue import Issue; Base.metadata.create_all(bind=engine)"
          pytest -v